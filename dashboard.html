<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uploader — Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2129;
    --border: #2a3441;
    --text: #e6edf3;
    --text-muted: #7d8a9a;
    --accent: #5eafc6;
    --done: #4ade80;
    --pending: #fbbf24;
    --overdue: #f87171;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 40px 20px 80px;
    min-height: 100vh;
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 .dim { color: var(--text-muted); font-weight: 400; }

  .heartbeat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--done);
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
    animation: pulse 2s infinite;
  }
  .pulse-dot.stale {
    background: var(--overdue);
    box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.6);
    animation: pulse-stale 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
    70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }
  @keyframes pulse-stale {
    0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.5); }
    70% { box-shadow: 0 0 0 7px rgba(248, 113, 113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
  }

  .presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 28px;
  }
  @media (max-width: 720px) {
    .presets { grid-template-columns: 1fr; }
  }

  .preset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .preset-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .preset-name {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .preset-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  .platform-block {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .platform-block:last-child { border-bottom: none; }

  .platform-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .video-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
  }

  .video-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .video-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 100px;
    flex-shrink: 0;
  }
  .status-pill.done { background: rgba(74, 222, 128, 0.15); color: var(--done); }
  .status-pill.pending { background: rgba(251, 191, 36, 0.15); color: var(--pending); }
  .status-pill.overdue { background: rgba(248, 113, 113, 0.15); color: var(--overdue); }

  .empty-note {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  .error-note {
    padding: 18px;
    font-size: 13px;
    color: var(--overdue);
    font-family: var(--mono);
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>uploader<span class="dim">/status</span></h1>
      <div class="heartbeat">
        <span class="pulse-dot" id="pulse"></span>
        <span id="heartbeat-text">checking...</span>
      </div>
    </header>

    <div class="presets" id="presets">
      <!-- filled by JS -->
    </div>

    <footer>refreshes automatically every 60s</footer>
  </div>

<script>
  // Point these at your actual Supabase project + bucket names.
  const SUPABASE_PROJECT = "https://johdbrdeldukkgbtmoed.supabase.co";
  const PRESETS = [
    { name: "dogs", bucket: "dogs-videos" },
    { name: "cats", bucket: "cats-videos" },
  ];

  function statusUrl(bucket) {
    return `${SUPABASE_PROJECT}/storage/v1/object/public/${bucket}/status.json?t=${Date.now()}`;
  }

  function fmtTime(iso) {
    // "2026-08-01T18:29:30" -> "18:29"
    const match = iso.match(/T(\d{2}:\d{2})/);
    return match ? match[1] : iso;
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function isOverdue(entry) {
    if (entry.status === "done") return false;
    return new Date(entry.time) < new Date();
  }

  function renderPlatform(label, entries) {
    let rows = "";
    if (!entries || entries.length === 0) {
      rows = `<div class="empty-note">Nothing scheduled today.</div>`;
    } else {
      rows = entries.map(e => {
        const overdue = isOverdue(e);
        const cls = e.status === "done" ? "done" : (overdue ? "overdue" : "pending");
        const label2 = e.status === "done" ? "Live" : (overdue ? "Overdue" : "Scheduled");
        return `
          <div class="video-row">
            <span class="video-name" title="${e.name}">${e.name.split("/").pop()}</span>
            <span class="video-time">${fmtTime(e.time)}</span>
            <span class="status-pill ${cls}">${label2}</span>
          </div>`;
      }).join("");
    }
    return `<div class="platform-block"><div class="platform-label">${label}</div>${rows}</div>`;
  }

  function renderPreset(presetName, data) {
    const today = data && data.today ? data.today : {};
    return `
      <div class="preset-card">
        <div class="preset-head">
          <span class="preset-name">${presetName}</span>
          <span class="preset-date">${today.date || "—"}</span>
        </div>
        ${renderPlatform("YouTube", today.youtube)}
        ${renderPlatform("Facebook", today.facebook)}
        ${renderPlatform("Instagram", today.instagram)}
        ${renderPlatform("TikTok", today.tiktok)}
      </div>`;
  }

  function renderError(presetName, message) {
    return `
      <div class="preset-card">
        <div class="preset-head"><span class="preset-name">${presetName}</span></div>
        <div class="error-note">Couldn't load status: ${message}</div>
      </div>`;
  }

  async function loadAll() {
    const container = document.getElementById("presets");
    let html = "";
    let mostRecentUpdate = null;

    for (const preset of PRESETS) {
      try {
        const resp = await fetch(statusUrl(preset.bucket), { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        html += renderPreset(preset.name, data);
        if (data.updated_at) {
          const t = new Date(data.updated_at);
          if (!mostRecentUpdate || t > mostRecentUpdate) mostRecentUpdate = t;
        }
      } catch (err) {
        html += renderError(preset.name, err.message);
      }
    }

    container.innerHTML = html;

    const pulse = document.getElementById("pulse");
    const heartbeatText = document.getElementById("heartbeat-text");
    if (mostRecentUpdate) {
      const staleMinutes = (Date.now() - mostRecentUpdate.getTime()) / 60000;
      const stale = staleMinutes > 120; // no update in 2h -> flag as possibly stopped
      pulse.classList.toggle("stale", stale);
      heartbeatText.textContent = `last update ${timeAgo(mostRecentUpdate.toISOString())}`;
    } else {
      pulse.classList.add("stale");
      heartbeatText.textContent = "no data yet";
    }
  }

  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
</html>
